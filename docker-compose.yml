services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ts_ddd
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ts_ddd']
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: .
    command: ['node', 'dist/cli/migrate.js', 'up']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ts_ddd
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ts_ddd
      PORT: '3000'
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
