name: Bug report
description: Something in the template is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Ran `docker compose up --build`
        2. POSTed to /api/v1/products
        3. Expected 201, got 500
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: '22.x'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'macOS 15 / Ubuntu 24.04 / Windows 11'
